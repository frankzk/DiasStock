name: Import EasySell Upsells

on:
  schedule:
    # 12:15pm America/Lima. GitHub Actions cron usa UTC.
    - cron: "15 17 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Fecha del run YYYY-MM-DD. Vacio = hoy en America/Lima."
        required: false
        type: string
      stores:
        description: "Tiendas a procesar separadas por coma."
        required: false
        default: "CR,HN"
        type: string

concurrency:
  group: import-easysell-upsells
  cancel-in-progress: false

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  import-easysell-upsells:
    runs-on: [self-hosted, Windows, X64, diasstock-easysell]
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SHOPIFY_API_VERSION: "2026-04"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SHOPIFY_ADMIN_STORAGE_STATE_B64: ${{ secrets.SHOPIFY_ADMIN_STORAGE_STATE_B64 }}
      EASYSELL_DEBUG_DIR: artifacts/easysell

      STORE_CR_NAME: "Mireva Costa Rica"
      STORE_CR_SHOPIFY_ADMIN_SLUG: "mireva-costa-rica"
      STORE_CR_SHOPIFY_URL: ${{ secrets.STORE_CR_SHOPIFY_URL }}
      STORE_CR_SHOPIFY_TOKEN: ${{ secrets.STORE_CR_SHOPIFY_TOKEN }}

      STORE_HN_NAME: "Mireva Honduras"
      STORE_HN_SHOPIFY_ADMIN_SLUG: "w0qckv-cz"
      STORE_HN_SHOPIFY_URL: ${{ secrets.STORE_HN_SHOPIFY_URL }}
      STORE_HN_SHOPIFY_TOKEN: ${{ secrets.STORE_HN_SHOPIFY_TOKEN }}

      STORE_KA_NAME: "Kenku Argentina"
      STORE_KA_TYPE: "image_inventory"
      STORE_KA_IMAGE_PATH: "data/kenku_argentina.jpeg"
      STORE_KA_SHOPIFY_ADMIN_SLUG: "rayytn-ia"
      STORE_KA_SHOPIFY_URL: ${{ secrets.STORE_KA_SHOPIFY_URL }}
      STORE_KA_SHOPIFY_TOKEN: ${{ secrets.STORE_KA_SHOPIFY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup portable Python
        run: |
          $pythonVersion = "3.12.10"
          $pythonRoot = Join-Path $env:RUNNER_TEMP "python-$pythonVersion-embed-amd64"
          $pythonExe = Join-Path $pythonRoot "python.exe"
          $repoRoot = (Get-Location).Path

          if (-not (Test-Path -LiteralPath $pythonExe)) {
            $zipPath = Join-Path $env:RUNNER_TEMP "python-$pythonVersion-embed-amd64.zip"
            $getPipPath = Join-Path $env:RUNNER_TEMP "get-pip.py"

            if (Test-Path -LiteralPath $pythonRoot) {
              Remove-Item -LiteralPath $pythonRoot -Recurse -Force
            }

            New-Item -ItemType Directory -Force -Path $pythonRoot | Out-Null
            Invoke-WebRequest `
              -Uri "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip" `
              -OutFile $zipPath
            Expand-Archive -LiteralPath $zipPath -DestinationPath $pythonRoot -Force

            Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPipPath
            & $pythonExe $getPipPath
          }

          $pthFile = Get-ChildItem -LiteralPath $pythonRoot -Filter "python*._pth" | Select-Object -First 1
          if ($pthFile) {
            $pthLines = Get-Content -LiteralPath $pthFile.FullName
            $pthLines = $pthLines -replace "^#import site$", "import site"
            if ($pthLines -notcontains $repoRoot) {
              $pthLines = @($repoRoot) + $pthLines
            }
            $pthLines | Set-Content -LiteralPath $pthFile.FullName -Encoding ascii
          }

          $pythonRoot | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PYTHONPATH=$repoRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $pythonExe --version
          & $pythonExe -m pip --version

      - name: Validate global secrets
        run: |
          $missing = $false

          function Test-RequiredSecret {
            param(
              [string]$EnvName,
              [string]$SecretName
            )

            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($EnvName))) {
              Write-Host "::error::Falta GitHub Repository Secret: $SecretName"
              $script:missing = $true
            }
          }

          Test-RequiredSecret "SUPABASE_URL" "SUPABASE_URL"
          Test-RequiredSecret "SUPABASE_SERVICE_ROLE_KEY" "SUPABASE_SERVICE_ROLE_KEY"
          Test-RequiredSecret "SHOPIFY_ADMIN_STORAGE_STATE_B64" "SHOPIFY_ADMIN_STORAGE_STATE_B64"

          if ($missing) {
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
          python -c "import src.config; print('Repo import OK')"

      - name: Determine run date and stores
        id: vars
        env:
          INPUT_RUN_DATE: ${{ github.event.inputs.run_date }}
          INPUT_STORES: ${{ github.event.inputs.stores }}
        run: |
          $runDate = $env:INPUT_RUN_DATE
          if ([string]::IsNullOrWhiteSpace($runDate)) {
            $timeZone = [TimeZoneInfo]::FindSystemTimeZoneById("SA Pacific Standard Time")
            $runDate = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $timeZone).ToString("yyyy-MM-dd")
          }

          $stores = $env:INPUT_STORES
          if ([string]::IsNullOrWhiteSpace($stores)) {
            $stores = "CR,HN"
          }

          "run_date=$runDate" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "stores=$stores" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "EasySell run date: $runDate"
          Write-Host "Stores: $stores"

      - name: Import EasySell upsells
        run: |
          if (Test-Path -LiteralPath $env:EASYSELL_DEBUG_DIR) {
            Remove-Item -LiteralPath $env:EASYSELL_DEBUG_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $env:EASYSELL_DEBUG_DIR | Out-Null

          function Test-RequiredSecret {
            param(
              [string]$EnvName,
              [string]$SecretName
            )

            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($EnvName))) {
              Write-Host "::error::Falta GitHub Repository Secret: $SecretName"
              return $false
            }

            return $true
          }

          function Test-StoreSecrets {
            param([string]$StoreKey)

            $valid = $true
            switch ($StoreKey) {
              "CR" {
                $valid = (Test-RequiredSecret "STORE_CR_SHOPIFY_URL" "STORE_CR_SHOPIFY_URL") -and $valid
                $valid = (Test-RequiredSecret "STORE_CR_SHOPIFY_TOKEN" "STORE_CR_SHOPIFY_TOKEN") -and $valid
              }
              "HN" {
                $valid = (Test-RequiredSecret "STORE_HN_SHOPIFY_URL" "STORE_HN_SHOPIFY_URL") -and $valid
                $valid = (Test-RequiredSecret "STORE_HN_SHOPIFY_TOKEN" "STORE_HN_SHOPIFY_TOKEN") -and $valid
              }
              "KA" {
                $valid = (Test-RequiredSecret "STORE_KA_SHOPIFY_URL" "STORE_KA_SHOPIFY_URL") -and $valid
                $valid = (Test-RequiredSecret "STORE_KA_SHOPIFY_TOKEN" "STORE_KA_SHOPIFY_TOKEN") -and $valid
              }
              default {
                Write-Host "::error::Tienda no soportada: $StoreKey"
                $valid = $false
              }
            }

            return $valid
          }

          $failedStores = @()
          $storeList = "${{ steps.vars.outputs.stores }}".Split(",") |
            ForEach-Object { $_.Trim().ToUpperInvariant() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          foreach ($store in $storeList) {
            Write-Host "::group::Import EasySell $store"
            if (-not (Test-StoreSecrets $store)) {
              $failedStores += "${store}:secrets"
              Write-Host "::endgroup::"
              continue
            }

            $logPath = Join-Path $env:EASYSELL_DEBUG_DIR "$store-import.log"
            $output = & python import_easysell_to_supabase.py --run-date "${{ steps.vars.outputs.run_date }}" --store "$store" --fail-on-zero 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            $output | Out-File -FilePath $logPath -Encoding utf8

            if ($exitCode -ne 0) {
              $tail = (($output | Select-Object -Last 20) -join "%0A")
              Write-Host "::error title=EasySell $store fallo::$tail"
              $failedStores += "${store}:import"
            }

            Write-Host "::endgroup::"
          }

          if ($failedStores.Count -gt 0) {
            Write-Host "::error::Fallaron tiendas EasySell: $($failedStores -join ' ')"
            exit 1
          }

      - name: Upload EasySell diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easysell-debug-${{ github.run_id }}
          path: artifacts/easysell
          if-no-files-found: ignore
