name: Import EasySell Upsells

on:
  schedule:
    # 12:15pm America/Lima. GitHub Actions cron usa UTC.
    - cron: "15 17 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Fecha del run YYYY-MM-DD. Vacio = hoy en America/Lima."
        required: false
        type: string
      stores:
        description: "Tiendas a procesar separadas por coma."
        required: false
        default: "CR,HN"
        type: string

concurrency:
  group: import-easysell-upsells
  cancel-in-progress: false

jobs:
  import-easysell-upsells:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SHOPIFY_API_VERSION: "2026-04"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SHOPIFY_ADMIN_STORAGE_STATE_B64: ${{ secrets.SHOPIFY_ADMIN_STORAGE_STATE_B64 }}

      STORE_CR_NAME: "Mireva Costa Rica"
      STORE_CR_SHOPIFY_ADMIN_SLUG: "mireva-costa-rica"
      STORE_CR_SHOPIFY_URL: ${{ secrets.STORE_CR_SHOPIFY_URL }}
      STORE_CR_SHOPIFY_TOKEN: ${{ secrets.STORE_CR_SHOPIFY_TOKEN }}

      STORE_HN_NAME: "Mireva Honduras"
      STORE_HN_SHOPIFY_ADMIN_SLUG: "w0qckv-cz"
      STORE_HN_SHOPIFY_URL: ${{ secrets.STORE_HN_SHOPIFY_URL }}
      STORE_HN_SHOPIFY_TOKEN: ${{ secrets.STORE_HN_SHOPIFY_TOKEN }}

      STORE_KA_NAME: "Kenku Argentina"
      STORE_KA_TYPE: "image_inventory"
      STORE_KA_IMAGE_PATH: "data/kenku_argentina.jpeg"
      STORE_KA_SHOPIFY_ADMIN_SLUG: "rayytn-ia"
      STORE_KA_SHOPIFY_URL: ${{ secrets.STORE_KA_SHOPIFY_URL }}
      STORE_KA_SHOPIFY_TOKEN: ${{ secrets.STORE_KA_SHOPIFY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate global secrets
        run: |
          missing=0

          check_secret() {
            env_name="$1"
            secret_name="$2"
            if [ -z "${!env_name}" ]; then
              echo "::error::Falta GitHub Repository Secret: $secret_name"
              missing=1
            fi
          }

          check_secret "SUPABASE_URL" "SUPABASE_URL"
          check_secret "SUPABASE_SERVICE_ROLE_KEY" "SUPABASE_SERVICE_ROLE_KEY"
          check_secret "SHOPIFY_ADMIN_STORAGE_STATE_B64" "SHOPIFY_ADMIN_STORAGE_STATE_B64"

          exit "$missing"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Determine run date and stores
        id: vars
        env:
          INPUT_RUN_DATE: ${{ github.event.inputs.run_date }}
          INPUT_STORES: ${{ github.event.inputs.stores }}
        run: |
          RUN_DATE="${INPUT_RUN_DATE}"
          if [ -z "$RUN_DATE" ]; then
            RUN_DATE="$(TZ=America/Lima date +%F)"
          fi

          STORES="${INPUT_STORES:-CR,HN}"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "stores=$STORES" >> "$GITHUB_OUTPUT"
          echo "EasySell run date: $RUN_DATE"
          echo "Stores: $STORES"

      - name: Import EasySell upsells
        run: |
          check_secret() {
            env_name="$1"
            secret_name="$2"
            if [ -z "${!env_name}" ]; then
              echo "::error::Falta GitHub Repository Secret: $secret_name"
              return 1
            fi
            return 0
          }

          validate_store() {
            store_key="$1"
            missing=0

            case "$store_key" in
              CR)
                check_secret "STORE_CR_SHOPIFY_URL" "STORE_CR_SHOPIFY_URL" || missing=1
                check_secret "STORE_CR_SHOPIFY_TOKEN" "STORE_CR_SHOPIFY_TOKEN" || missing=1
                ;;
              HN)
                check_secret "STORE_HN_SHOPIFY_URL" "STORE_HN_SHOPIFY_URL" || missing=1
                check_secret "STORE_HN_SHOPIFY_TOKEN" "STORE_HN_SHOPIFY_TOKEN" || missing=1
                ;;
              KA)
                check_secret "STORE_KA_SHOPIFY_URL" "STORE_KA_SHOPIFY_URL" || missing=1
                check_secret "STORE_KA_SHOPIFY_TOKEN" "STORE_KA_SHOPIFY_TOKEN" || missing=1
                ;;
              *)
                echo "::error::Tienda no soportada: $store_key"
                missing=1
                ;;
            esac

            return "$missing"
          }

          failed_stores=()
          IFS=',' read -ra STORE_LIST <<< "${{ steps.vars.outputs.stores }}"
          for raw_store in "${STORE_LIST[@]}"; do
            store="$(echo "$raw_store" | xargs | tr '[:lower:]' '[:upper:]')"
            if [ -z "$store" ]; then
              continue
            fi

            echo "::group::Import EasySell $store"
            if ! validate_store "$store"; then
              failed_stores+=("$store:secrets")
              echo "::endgroup::"
              continue
            fi

            if ! python import_easysell_to_supabase.py \
              --run-date "${{ steps.vars.outputs.run_date }}" \
              --store "$store"; then
              failed_stores+=("$store:import")
            fi
            echo "::endgroup::"
          done

          if [ "${#failed_stores[@]}" -gt 0 ]; then
            echo "::error::Fallaron tiendas EasySell: ${failed_stores[*]}"
            exit 1
          fi
