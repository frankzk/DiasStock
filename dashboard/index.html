<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DiasStock Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./config.js"></script>
  <style>
    :root {
      --bg: #f6f7f4;
      --surface: #ffffff;
      --surface-soft: #eef4f1;
      --ink: #17211f;
      --muted: #63706b;
      --line: #d9e1dc;
      --primary: #0f766e;
      --primary-strong: #115e59;
      --danger: #b42318;
      --danger-soft: #fff1ef;
      --warn: #a15c07;
      --warn-soft: #fff6e6;
      --good: #137333;
      --good-soft: #edf8ef;
      --info: #2458c9;
      --info-soft: #edf3ff;
      --shadow: 0 16px 40px rgba(23, 33, 31, 0.08);
      --radius: 8px;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
      padding: 0 16px;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    button:hover {
      border-color: #b9c6c0;
      background: #f9fbfa;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(15, 118, 110, 0.25);
      outline-offset: 2px;
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    button.primary:hover {
      background: var(--primary-strong);
      border-color: var(--primary-strong);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .app-hidden {
      display: none;
    }

    .login-screen {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: 24px;
    }

    .login-screen.hidden {
      display: none;
    }

    .login-card {
      width: min(100%, 420px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .login-card .brand {
      margin-bottom: 22px;
    }

    .login-form {
      display: grid;
      gap: 14px;
    }

    .login-error {
      min-height: 22px;
      color: var(--danger);
      font-size: 14px;
      font-weight: 700;
    }

    .app-shell {
      width: min(1560px, calc(100% - 24px));
      margin: 0 auto;
      padding: 12px 0 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: var(--radius);
      background: #14332f;
      color: #d7fff7;
      font-weight: 800;
      letter-spacing: 0;
      flex: 0 0 auto;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    h2 {
      font-size: 16px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .top-actions,
    .form-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-store-field {
      display: grid;
      gap: 4px;
      min-width: 220px;
    }

    .top-store-field span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .top-store-field select {
      min-height: 38px;
    }

    .config-panel,
    .filters,
    .table-section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .config-panel {
      padding: 18px;
      margin-bottom: 10px;
    }

    .config-panel.hidden {
      display: none;
    }

    .config-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
      gap: 14px;
      margin: 14px 0;
    }

    .field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .field span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      color: var(--ink);
      padding: 0 12px;
    }

    .form-message {
      min-height: 22px;
      color: var(--danger);
      font-size: 14px;
      font-weight: 700;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(6, minmax(140px, 1fr));
      gap: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .search-field {
      grid-column: span 2;
    }

    .range-filters {
      grid-template-columns: repeat(4, minmax(180px, 1fr)) auto;
      align-items: end;
    }

    .range-field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .range-field > span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .range-inputs {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: minmax(0, 0.86fr) minmax(0, 1fr) minmax(0, 0.72fr);
      gap: 8px;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: none;
      padding: 8px;
    }

    .summary-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .summary-chip,
    .summary-group,
    .summary-priority {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fcfdfc;
    }

    .summary-chip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "label value"
        "note value";
      align-items: center;
      gap: 0 8px;
      min-height: 38px;
      padding: 5px 8px;
    }

    .metric-label {
      grid-area: label;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.15;
    }

    .metric-value {
      grid-area: value;
      font-size: 18px;
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .metric-note {
      grid-area: note;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-status {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.85fr);
      gap: 6px;
      min-width: 0;
    }

    .summary-group,
    .summary-priority {
      padding: 6px 8px;
    }

    .summary-group-header,
    .priority-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .summary-group-header h2,
    .priority-header h2 {
      font-size: 12px;
      line-height: 1.2;
    }

    .status-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .status-count-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      padding: 0 6px;
      white-space: nowrap;
    }

    .status-count-chip strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--muted);
    }

    .priority-list {
      display: grid;
      gap: 5px;
    }

    .priority-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 27px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 6px;
      background: white;
    }

    .priority-title {
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .priority-meta {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.15;
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .priority-more {
      width: 100%;
      min-height: 26px;
      margin-top: 5px;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 11px;
    }

    .priority-more.hidden {
      display: none;
    }

    .table-section {
      overflow: hidden;
      box-shadow: none;
    }

    .table-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }

    .table-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: #1e3f39;
      font-size: 13px;
      font-weight: 800;
      padding: 0 8px;
      white-space: nowrap;
    }

    .table-wrap {
      overflow-x: hidden;
    }

    table {
      width: 100%;
      min-width: 0;
      table-layout: fixed;
      border-collapse: collapse;
    }

    .col-history { width: 4%; }
    .col-date { width: 6%; }
    .col-store { width: 7%; }
    .col-image { width: 5%; }
    .col-product { width: 19%; }
    .col-sku { width: 8%; }
    .col-stock { width: 5%; }
    .col-sold { width: 5%; }
    .col-average { width: 6%; }
    .col-days { width: 6%; }
    .col-inventory { width: 10%; }
    .col-sale { width: 8%; }
    .col-alert { width: 11%; }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 5px 6px;
      text-align: left;
      vertical-align: middle;
      font-size: 11px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    th {
      position: sticky;
      top: 0;
      background: #f9fbfa;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      z-index: 1;
    }

    .sort-button {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 3px;
      width: 100%;
      min-height: 24px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      padding: 0;
      text-align: left;
      text-transform: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: 1.15;
      white-space: normal;
      cursor: pointer;
    }

    .sort-button:hover {
      background: transparent;
      color: var(--primary);
    }

    .sort-indicator {
      color: var(--primary);
      font-size: 12px;
      min-width: 6px;
    }

    td.number {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-family: var(--mono);
      white-space: nowrap;
    }

    .history-toggle {
      display: inline-grid;
      width: 24px;
      height: 24px;
      min-height: 24px;
      place-items: center;
      border-radius: 6px;
      padding: 0;
      font-size: 16px;
      line-height: 1;
    }

    .history-toggle:disabled {
      cursor: default;
      opacity: 0.32;
    }

    .history-row td {
      background: #fbfcfb;
      color: #52605b;
    }

    .history-row .product-cell {
      font-weight: 700;
    }

    .history-marker {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      padding: 0 6px;
      text-transform: uppercase;
    }

    .product-cell {
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .product-thumb {
      display: block;
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f3f5f4;
      object-fit: cover;
    }

    .image-placeholder {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f3f5f4;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .sku {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 7px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      max-width: 100%;
    }

    .badge.critical {
      border-color: #ffd5d0;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .badge.low {
      border-color: #ffdf9a;
      background: var(--warn-soft);
      color: var(--warn);
    }

    .badge.ok {
      border-color: #c7ebcf;
      background: var(--good-soft);
      color: var(--good);
    }

    .badge.high {
      border-color: #cfe0ff;
      background: var(--info-soft);
      color: var(--info);
    }

    .badge.none {
      border-color: #d8dde0;
      background: #f3f5f5;
      color: #52605b;
    }

    .alert-text {
      color: var(--danger);
      font-weight: 800;
    }

    .empty {
      padding: 24px 12px;
      color: var(--muted);
      text-align: center;
      font-weight: 700;
    }

    @media (max-width: 920px) {
      .app-shell {
        width: min(100% - 16px, 1560px);
        padding-top: 10px;
      }

      .topbar,
      .table-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions,
      .form-actions {
        width: 100%;
      }

      .top-store-field {
        flex: 1 1 100%;
      }

      .top-actions button,
      .form-actions button {
        flex: 1 1 160px;
      }

      .config-grid,
      .filters,
      .range-filters,
      .summary-strip,
      .summary-status {
        grid-template-columns: 1fr;
      }

      .search-field {
        grid-column: auto;
      }

      .metric-value {
        font-size: 20px;
      }
    }

    @media (max-width: 760px) {
      table,
      thead,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      table {
        table-layout: auto;
      }

      thead,
      colgroup {
        display: none;
      }

      tbody {
        display: grid;
        gap: 8px;
        padding: 8px;
      }

      tr {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 8px;
      }

      td {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        border-bottom: 0;
        padding: 4px 0;
        font-size: 12px;
      }

      td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
      }

      td.number {
        text-align: left;
      }

      td.empty {
        display: block;
        padding: 18px 8px;
        text-align: center;
      }

      td.empty::before {
        content: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <section class="login-screen hidden" id="loginScreen" aria-labelledby="loginTitle">
    <div class="login-card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">DS</span>
        <div>
          <h1 id="loginTitle">DiasStock</h1>
          <p class="subtitle">Acceso privado</p>
        </div>
      </div>
      <form class="login-form" id="loginForm">
        <label class="field" for="loginUser">
          <span>Usuario</span>
          <input id="loginUser" name="user" type="text" autocomplete="username" required>
        </label>
        <label class="field" for="loginPassword">
          <span>Contraseña</span>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primary">Ingresar</button>
        <p class="login-error" id="loginError" role="alert"></p>
      </form>
    </div>
  </section>

  <main class="app-shell app-hidden" id="appShell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">DS</span>
        <div>
          <h1>DiasStock</h1>
          <p class="subtitle" id="lastUpdated">Sin datos cargados</p>
        </div>
      </div>
      <div class="top-actions">
        <label class="top-store-field" for="storeFilter">
          <span>Tienda</span>
          <select id="storeFilter"></select>
        </label>
        <button type="button" class="primary" id="refreshBtn">Actualizar</button>
        <button type="button" id="exportExcelBtn">Descargar Excel</button>
        <button type="button" id="configToggle">Configuracion</button>
      </div>
    </header>

    <section class="config-panel hidden" id="configPanel" aria-labelledby="configTitle">
      <h2 id="configTitle">Supabase</h2>
      <form id="configForm">
        <div class="config-grid">
          <label class="field" for="supabaseUrl">
            <span>Project URL</span>
            <input id="supabaseUrl" name="url" type="url" autocomplete="url" placeholder="https://xxxx.supabase.co">
          </label>
          <label class="field" for="supabaseAnon">
            <span>Anon public key</span>
            <input id="supabaseAnon" name="anon" type="password" autocomplete="off" placeholder="eyJhbGciOi...">
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary">Guardar</button>
          <button type="button" id="clearConfigBtn">Olvidar</button>
        </div>
        <p class="form-message" id="configError" role="alert"></p>
      </form>
    </section>

    <section class="summary-strip" aria-label="Resumen compacto">
      <div class="summary-metrics" aria-label="Metricas">
        <article class="summary-chip">
          <p class="metric-label">Productos</p>
          <p class="metric-value" id="metricProducts">0</p>
          <p class="metric-note" id="metricProductsNote">Sin filtros</p>
        </article>
        <article class="summary-chip">
          <p class="metric-label">Reordenar</p>
          <p class="metric-value" id="metricReorder">0</p>
          <p class="metric-note">Urgente o pronto</p>
        </article>
        <article class="summary-chip">
          <p class="metric-label">Sobrestock</p>
          <p class="metric-value" id="metricOverstock">0</p>
          <p class="metric-note">Riesgo activo</p>
        </article>
        <article class="summary-chip">
          <p class="metric-label">Dias Stock medianos</p>
          <p class="metric-value" id="metricMedian">0</p>
          <p class="metric-note">Con venta</p>
        </article>
      </div>
      <div class="summary-status" aria-label="Estados">
        <article class="summary-group">
          <div class="summary-group-header">
            <h2>Inventario</h2>
            <span class="count-pill" id="stateTotal">0 filas</span>
          </div>
          <div class="status-chip-list" id="inventoryStatusList"></div>
        </article>
        <article class="summary-group">
          <div class="summary-group-header">
            <h2>Venta</h2>
            <span class="count-pill" id="saleTotal">0 filas</span>
          </div>
          <div class="status-chip-list" id="saleStatusList"></div>
        </article>
      </div>
      <article class="summary-priority">
        <div class="priority-header">
          <h2>Prioridad</h2>
          <span class="count-pill" id="priorityTotal">0</span>
        </div>
        <div class="priority-list" id="priorityList"></div>
        <button type="button" class="priority-more hidden" id="priorityMoreBtn" aria-expanded="false">Ver mas</button>
      </article>
    </section>

    <section class="filters primary-filters" aria-label="Filtros principales">
      <label class="field search-field" for="searchInput">
        <span>Buscar</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Producto o SKU">
      </label>
      <label class="field" for="dateFilter">
        <span>Fecha</span>
        <select id="dateFilter"></select>
      </label>
      <label class="field" for="statusFilter">
        <span>Estado inventario</span>
        <select id="statusFilter"></select>
      </label>
      <label class="field" for="saleStatusFilter">
        <span>Estado venta</span>
        <select id="saleStatusFilter"></select>
      </label>
      <label class="field" for="alertFilter">
        <span>Alerta</span>
        <select id="alertFilter"></select>
      </label>
    </section>

    <section class="filters range-filters" aria-label="Filtros numericos">
      <label class="range-field" for="stockMin">
        <span>Stock</span>
        <span class="range-inputs">
          <input id="stockMin" type="number" inputmode="decimal" min="1" placeholder="Min" value="1">
          <input id="stockMax" type="number" inputmode="decimal" placeholder="Max">
        </span>
      </label>
      <label class="range-field" for="soldMin">
        <span>Ventas 7d</span>
        <span class="range-inputs">
          <input id="soldMin" type="number" inputmode="decimal" placeholder="Min">
          <input id="soldMax" type="number" inputmode="decimal" placeholder="Max">
        </span>
      </label>
      <label class="range-field" for="avgMin">
        <span>Prom/dia</span>
        <span class="range-inputs">
          <input id="avgMin" type="number" inputmode="decimal" step="0.01" placeholder="Min">
          <input id="avgMax" type="number" inputmode="decimal" step="0.01" placeholder="Max">
        </span>
      </label>
      <label class="range-field" for="daysMin">
        <span>Dias Stock</span>
        <span class="range-inputs">
          <input id="daysMin" type="number" inputmode="decimal" step="0.1" placeholder="Min">
          <input id="daysMax" type="number" inputmode="decimal" step="0.1" placeholder="Max">
        </span>
      </label>
      <button type="button" id="resetFiltersBtn">Limpiar filtros</button>
    </section>

    <section class="table-section" aria-labelledby="tableTitle">
      <div class="table-head">
        <h2 id="tableTitle">Snapshots</h2>
        <div class="table-actions">
          <button type="button" id="tableExportBtn">Descargar Excel</button>
          <span class="count-pill" id="resultCount">0 resultados</span>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <colgroup>
            <col class="col-history">
            <col class="col-date">
            <col class="col-store">
            <col class="col-image">
            <col class="col-product">
            <col class="col-sku">
            <col class="col-stock">
            <col class="col-sold">
            <col class="col-average">
            <col class="col-days">
            <col class="col-inventory">
            <col class="col-sale">
            <col class="col-alert">
          </colgroup>
          <thead>
            <tr>
              <th>Hist.</th>
              <th><button type="button" class="sort-button" data-sort-key="date">Fecha <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="storeName">Tienda <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="imageUrl">Imagen <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="product">Producto <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="sku">SKU <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="stock">Stock <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="sold7">Ventas 7d <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="dailyAvg">Prom/dia <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="days">Dias Stock <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="status">Estado inventario <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="saleStatus">Estado venta <span class="sort-indicator"></span></button></th>
              <th><button type="button" class="sort-button" data-sort-key="alert">Alerta <span class="sort-indicator"></span></button></th>
            </tr>
          </thead>
          <tbody id="snapshotBody">
            <tr>
              <td colspan="13" class="empty">Sin datos</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const DEPLOY_CONFIG = window.DIASSTOCK_CONFIG || {};
    const SUPABASE_URL = DEPLOY_CONFIG.SUPABASE_URL || "";
    const SUPABASE_ANON = DEPLOY_CONFIG.SUPABASE_ANON_KEY || "";
    const STORAGE_KEY = "diasstock.supabase.config.v1";
    const LOGIN_STORAGE_KEY = "diasstock.dashboard.auth.v1";
    const DASHBOARD_USER = DEPLOY_CONFIG.DASHBOARD_USER || "";
    const DASHBOARD_PASSWORD_HASH = DEPLOY_CONFIG.DASHBOARD_PASSWORD_HASH || "";
    const DEFAULT_STOCK_MIN = "1";

    const STATUS_ORDER = ["CRITICO", "BAJO", "OK", "ALTO", "Sin ventas"];
    const STATUS_META = {
      "CRITICO": { label: "CRITICO", className: "critical", color: "#b42318" },
      "BAJO": { label: "BAJO", className: "low", color: "#a15c07" },
      "OK": { label: "OK", className: "ok", color: "#137333" },
      "ALTO": { label: "ALTO", className: "high", color: "#2458c9" },
      "Sin ventas": { label: "Sin ventas", className: "none", color: "#52605b" },
    };
    const SALE_STATUS_ORDER = ["ALTA", "MEDIA", "BAJA", "SIN VENTAS"];
    const SALE_STATUS_META = {
      "ALTA": { className: "ok", color: "#137333" },
      "MEDIA": { className: "low", color: "#a15c07" },
      "BAJA": { className: "critical", color: "#b42318" },
      "SIN VENTAS": { className: "none", color: "#52605b" },
    };
    const TABLE_COLUMNS = [
      { key: "date", label: "Fecha", type: "date" },
      { key: "storeName", label: "Tienda", type: "text" },
      { key: "imageUrl", label: "Imagen", type: "text" },
      { key: "product", label: "Producto", type: "text" },
      { key: "sku", label: "SKU", type: "text" },
      { key: "stock", label: "Stock", type: "number" },
      { key: "sold7", label: "Ventas 7d", type: "number" },
      { key: "dailyAvg", label: "Prom/dia", type: "number" },
      { key: "days", label: "Dias Stock", type: "number" },
      { key: "status", label: "Estado de Inventario", type: "status" },
      { key: "saleStatus", label: "Estado de Venta", type: "saleStatus" },
      { key: "alert", label: "Alerta", type: "text" },
    ];

    const state = {
      rows: [],
      filteredRows: [],
      historyRows: [],
      expandedProductKeys: new Set(),
      showAllPriority: false,
      loading: false,
      client: null,
      sort: { key: "date", direction: "desc" },
    };

    const $ = (selector) => document.querySelector(selector);
    const els = {
      body: $("#snapshotBody"),
      configPanel: $("#configPanel"),
      configForm: $("#configForm"),
      configError: $("#configError"),
      supabaseUrl: $("#supabaseUrl"),
      supabaseAnon: $("#supabaseAnon"),
      refreshBtn: $("#refreshBtn"),
      configToggle: $("#configToggle"),
      clearConfigBtn: $("#clearConfigBtn"),
      searchInput: $("#searchInput"),
      storeFilter: $("#storeFilter"),
      dateFilter: $("#dateFilter"),
      statusFilter: $("#statusFilter"),
      saleStatusFilter: $("#saleStatusFilter"),
      alertFilter: $("#alertFilter"),
      stockMin: $("#stockMin"),
      stockMax: $("#stockMax"),
      soldMin: $("#soldMin"),
      soldMax: $("#soldMax"),
      avgMin: $("#avgMin"),
      avgMax: $("#avgMax"),
      daysMin: $("#daysMin"),
      daysMax: $("#daysMax"),
      resetFiltersBtn: $("#resetFiltersBtn"),
      exportExcelBtn: $("#exportExcelBtn"),
      tableExportBtn: $("#tableExportBtn"),
      lastUpdated: $("#lastUpdated"),
      resultCount: $("#resultCount"),
      stateTotal: $("#stateTotal"),
      saleTotal: $("#saleTotal"),
      priorityTotal: $("#priorityTotal"),
      inventoryStatusList: $("#inventoryStatusList"),
      saleStatusList: $("#saleStatusList"),
      priorityList: $("#priorityList"),
      priorityMoreBtn: $("#priorityMoreBtn"),
      metricProducts: $("#metricProducts"),
      metricProductsNote: $("#metricProductsNote"),
      metricReorder: $("#metricReorder"),
      metricOverstock: $("#metricOverstock"),
      metricMedian: $("#metricMedian"),
      appShell: $("#appShell"),
      loginScreen: $("#loginScreen"),
      loginForm: $("#loginForm"),
      loginUser: $("#loginUser"),
      loginPassword: $("#loginPassword"),
      loginError: $("#loginError"),
    };

    function isLoginEnabled() {
      return Boolean(DASHBOARD_USER && DASHBOARD_PASSWORD_HASH);
    }

    function isLoggedIn() {
      if (!isLoginEnabled()) return true;
      return sessionStorage.getItem(LOGIN_STORAGE_KEY) === "ok";
    }

    function showApp() {
      els.loginScreen.classList.add("hidden");
      els.appShell.classList.remove("app-hidden");
    }

    function showLogin() {
      els.appShell.classList.add("app-hidden");
      els.loginScreen.classList.remove("hidden");
      els.loginUser.focus();
    }

    async function sha256(value) {
      const data = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(digest))
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    async function handleLogin(event) {
      event.preventDefault();
      els.loginError.textContent = "";

      const user = els.loginUser.value.trim();
      const password = els.loginPassword.value;
      const passwordHash = await sha256(password);

      if (user === DASHBOARD_USER && passwordHash === DASHBOARD_PASSWORD_HASH) {
        sessionStorage.setItem(LOGIN_STORAGE_KEY, "ok");
        els.loginPassword.value = "";
        showApp();
        refreshData();
      } else {
        els.loginError.textContent = "Usuario o contraseña incorrectos.";
        els.loginPassword.select();
      }
    }

    function getStoredConfig() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function getConfig() {
      const stored = getStoredConfig();
      return {
        url: SUPABASE_URL.trim() || (stored.url || "").trim(),
        anon: SUPABASE_ANON.trim() || (stored.anon || "").trim(),
      };
    }

    function saveConfig(url, anon) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ url, anon }));
    }

    function getJwtRole(token) {
      const parts = token.split(".");
      if (parts.length < 2) return "";
      try {
        const normalized = parts[1].replace(/-/g, "+").replace(/_/g, "/");
        const payload = JSON.parse(atob(normalized));
        return payload.role || "";
      } catch {
        return "";
      }
    }

    function getConfigProblem(config) {
      if (!config.url || !config.anon) return "Completa Project URL y anon public key.";
      if (!config.url.includes(".supabase.co")) return "Project URL no parece ser de Supabase.";
      if (config.anon.startsWith("sb_secret_")) return "Esa key es privada. Usa la anon public key.";
      if (getJwtRole(config.anon) === "service_role") return "Esa key tiene rol service_role. Usa la anon public key.";
      return "";
    }

    function openConfig(message) {
      const config = getConfig();
      els.supabaseUrl.value = config.url;
      els.supabaseAnon.value = config.anon;
      els.configError.textContent = message || "";
      els.configPanel.classList.remove("hidden");
      els.supabaseUrl.focus();
    }

    function closeConfig() {
      els.configPanel.classList.add("hidden");
      els.configError.textContent = "";
    }

    function setLoading(isLoading) {
      state.loading = isLoading;
      els.refreshBtn.disabled = isLoading;
      els.refreshBtn.textContent = isLoading ? "Cargando" : "Actualizar";
    }

    function createClient() {
      const config = getConfig();
      const problem = getConfigProblem(config);
      if (problem) {
        openConfig(problem);
        return null;
      }
      if (!window.supabase || !window.supabase.createClient) {
        openConfig("No se pudo cargar Supabase JS. Revisa la conexion.");
        return null;
      }
      return window.supabase.createClient(config.url, config.anon);
    }

    async function refreshData() {
      const client = createClient();
      if (!client) return;

      state.client = client;
      setLoading(true);
      els.lastUpdated.textContent = "Cargando snapshots";

      try {
        const { data, error } = await client
          .from("inventory_snapshots")
          .select("*")
          .order("run_date", { ascending: false })
          .limit(5000);

        if (error) throw error;

        state.rows = (data || []).map(normalizeRow);
        state.expandedProductKeys.clear();
        state.showAllPriority = false;
        buildFilters();
        applyFilters();
        closeConfig();
        const now = new Date();
        els.lastUpdated.textContent = `Actualizado ${now.toLocaleString("es-PE")}`;
      } catch (error) {
        openConfig(error.message || "No se pudieron cargar los snapshots.");
        els.lastUpdated.textContent = "Error al cargar";
      } finally {
        setLoading(false);
      }
    }

    function normalizeRow(row) {
      const status = row.status || "Sin ventas";
      return {
        id: row.id || `${row.run_date}-${row.store_key || ""}-${row.sku || ""}`,
        date: row.run_date || "",
        storeKey: row.store_key || "",
        storeName: row.store_name || row.store_key || "Sin tienda",
        product: row.product_name || "",
        imageUrl: row.product_image_url || "",
        sku: row.sku || "",
        stock: Number(row.stock || 0),
        sold7: Number(row.units_sold_7d || 0),
        dailyAvg: Number(row.daily_avg || 0),
        days: row.days_of_stock === null || row.days_of_stock === undefined ? null : Number(row.days_of_stock),
        status,
        saleStatus: row.estado_venta || "SIN VENTAS",
        alert: row.alerta || "",
      };
    }

    function buildFilters() {
      const current = {
        store: els.storeFilter.value,
        date: els.dateFilter.value,
        status: els.statusFilter.value,
        saleStatus: els.saleStatusFilter.value,
        alert: els.alertFilter.value,
      };

      const stores = Array.from(
        new Map(
          state.rows
            .filter((row) => row.storeKey || row.storeName)
            .map((row) => [row.storeKey || row.storeName, row.storeName || row.storeKey])
        )
      ).sort((a, b) => a[1].localeCompare(b[1], "es"));

      const dates = Array.from(new Set(state.rows.map((row) => row.date).filter(Boolean))).sort().reverse();
      const saleStatuses = uniqueOrdered(
        state.rows.map((row) => row.saleStatus).filter(Boolean),
        SALE_STATUS_ORDER
      );
      const alerts = Array.from(new Set(state.rows.map((row) => row.alert).filter(Boolean)))
        .sort((a, b) => a.localeCompare(b, "es"));

      fillSelect(els.storeFilter, [["", "Todas"], ...stores], current.store);
      fillSelect(els.dateFilter, [["", "Todas"], ...dates.map((date) => [date, formatDate(date)])], current.date);
      fillSelect(els.statusFilter, [["", "Todos"], ...STATUS_ORDER.map((status) => [status, status])], current.status);
      fillSelect(els.saleStatusFilter, [["", "Todos"], ...saleStatuses.map((status) => [status, status])], current.saleStatus);
      fillSelect(els.alertFilter, [["", "Todas"], ["__empty__", "Sin alerta"], ...alerts.map((alert) => [alert, alert])], current.alert);
    }

    function uniqueOrdered(values, preferredOrder) {
      const set = new Set(values);
      return [
        ...preferredOrder.filter((value) => set.has(value)),
        ...Array.from(set).filter((value) => !preferredOrder.includes(value)).sort((a, b) => a.localeCompare(b, "es")),
      ];
    }

    function fillSelect(select, options, selectedValue) {
      select.innerHTML = "";
      for (const [value, label] of options) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        select.appendChild(option);
      }
      if (options.some(([value]) => value === selectedValue)) {
        select.value = selectedValue;
      }
    }

    function applyFilters() {
      const filters = getFilterValues();

      const productPool = state.rows
        .filter((row) => !filters.search || `${row.product} ${row.sku}`.toLowerCase().includes(filters.search))
        .filter((row) => !filters.store || row.storeKey === filters.store || row.storeName === filters.store);

      state.historyRows = productPool.slice().sort(compareHistoryRows);

      const displayRows = filters.date
        ? productPool.filter((row) => row.date === filters.date)
        : getLatestRowsByProduct(productPool);

      state.filteredRows = displayRows
        .filter((row) => !filters.date || row.date === filters.date)
        .filter((row) => !filters.status || row.status === filters.status)
        .filter((row) => !filters.saleStatus || row.saleStatus === filters.saleStatus)
        .filter((row) => !filters.alert || (filters.alert === "__empty__" ? !row.alert : row.alert === filters.alert))
        .filter((row) => inRange(row.stock, filters.stockMin, filters.stockMax))
        .filter((row) => inRange(row.sold7, filters.soldMin, filters.soldMax))
        .filter((row) => inRange(row.dailyAvg, filters.avgMin, filters.avgMax))
        .filter((row) => inRange(row.days, filters.daysMin, filters.daysMax))
        .sort(compareRows);

      const visibleKeys = new Set(state.filteredRows.map(productKey));
      for (const key of Array.from(state.expandedProductKeys)) {
        if (!visibleKeys.has(key)) state.expandedProductKeys.delete(key);
      }

      render();
    }

    function getLatestRowsByProduct(rows) {
      const latest = new Map();
      for (const row of rows) {
        const key = productKey(row);
        const current = latest.get(key);
        if (!current || compareLatestRow(row, current) < 0) {
          latest.set(key, row);
        }
      }
      return Array.from(latest.values());
    }

    function compareLatestRow(a, b) {
      const byDate = b.date.localeCompare(a.date);
      if (byDate !== 0) return byDate;
      return a.product.localeCompare(b.product, "es", { numeric: true, sensitivity: "base" });
    }

    function compareHistoryRows(a, b) {
      const byDate = b.date.localeCompare(a.date);
      if (byDate !== 0) return byDate;
      const byStore = a.storeName.localeCompare(b.storeName, "es");
      if (byStore !== 0) return byStore;
      return a.product.localeCompare(b.product, "es", { numeric: true, sensitivity: "base" });
    }

    function productKey(row) {
      const store = row.storeKey || row.storeName || "";
      const product = row.sku || row.product || row.id || "";
      return `${store}::${product}`.toLowerCase();
    }

    function getFilterValues() {
      return {
        search: els.searchInput.value.trim().toLowerCase(),
        store: els.storeFilter.value,
        date: els.dateFilter.value,
        status: els.statusFilter.value,
        saleStatus: els.saleStatusFilter.value,
        alert: els.alertFilter.value,
        stockMin: parseFilterNumber(els.stockMin.value),
        stockMax: parseFilterNumber(els.stockMax.value),
        soldMin: parseFilterNumber(els.soldMin.value),
        soldMax: parseFilterNumber(els.soldMax.value),
        avgMin: parseFilterNumber(els.avgMin.value),
        avgMax: parseFilterNumber(els.avgMax.value),
        daysMin: parseFilterNumber(els.daysMin.value),
        daysMax: parseFilterNumber(els.daysMax.value),
      };
    }

    function parseFilterNumber(value) {
      if (value === "") return null;
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function inRange(value, min, max) {
      if (min === null && max === null) return true;
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return false;
      const number = Number(value);
      if (min !== null && number < min) return false;
      if (max !== null && number > max) return false;
      return true;
    }

    function compareRows(a, b) {
      const column = TABLE_COLUMNS.find((item) => item.key === state.sort.key) || TABLE_COLUMNS[0];
      const primary = compareValues(a[column.key], b[column.key], column.type);
      if (primary !== 0) {
        return state.sort.direction === "asc" ? primary : -primary;
      }

      const byDate = b.date.localeCompare(a.date);
      if (byDate !== 0) return byDate;
      const byStore = a.storeName.localeCompare(b.storeName, "es");
      if (byStore !== 0) return byStore;
      return a.product.localeCompare(b.product, "es");
    }

    function compareValues(a, b, type) {
      if (type === "number") {
        const aNumber = Number.isFinite(Number(a)) ? Number(a) : Number.POSITIVE_INFINITY;
        const bNumber = Number.isFinite(Number(b)) ? Number(b) : Number.POSITIVE_INFINITY;
        return aNumber - bNumber;
      }
      if (type === "status") {
        return getOrderIndex(STATUS_ORDER, a) - getOrderIndex(STATUS_ORDER, b);
      }
      if (type === "saleStatus") {
        return getOrderIndex(SALE_STATUS_ORDER, a) - getOrderIndex(SALE_STATUS_ORDER, b);
      }
      return String(a || "").localeCompare(String(b || ""), "es", { numeric: true, sensitivity: "base" });
    }

    function getOrderIndex(order, value) {
      const index = order.indexOf(value);
      return index === -1 ? order.length : index;
    }

    function render() {
      renderMetrics();
      renderStatusBars();
      renderPriorityList();
      renderTable();
    }

    function renderMetrics() {
      const rows = state.filteredRows;
      const reorder = rows.filter((row) => row.alert.toLowerCase().includes("reordenar")).length;
      const overstock = rows.filter((row) => row.alert.toLowerCase().includes("sobrestock")).length;
      const days = rows.map((row) => row.days).filter((value) => Number.isFinite(value)).sort((a, b) => a - b);
      const median = days.length ? days[Math.floor(days.length / 2)] : 0;
      const filters = getFilterValues();
      const activeFilters = Object.entries(filters)
        .filter(([key, value]) => value !== "" && value !== null && !(key === "stockMin" && value === Number(DEFAULT_STOCK_MIN)))
        .length;

      els.metricProducts.textContent = formatNumber(rows.length);
      els.metricProductsNote.textContent = activeFilters ? `${activeFilters} filtro(s)` : "Sin filtros";
      els.metricReorder.textContent = formatNumber(reorder);
      els.metricOverstock.textContent = formatNumber(overstock);
      els.metricMedian.textContent = formatDays(median);
      els.resultCount.textContent = `${formatNumber(rows.length)} resultado${rows.length === 1 ? "" : "s"}`;
      els.stateTotal.textContent = `${formatNumber(rows.length)} fila${rows.length === 1 ? "" : "s"}`;
      els.saleTotal.textContent = `${formatNumber(rows.length)} fila${rows.length === 1 ? "" : "s"}`;
      els.exportExcelBtn.disabled = rows.length === 0;
      els.tableExportBtn.disabled = rows.length === 0;
    }

    function renderStatusBars() {
      const rows = state.filteredRows;
      const inventoryCounts = Object.fromEntries(STATUS_ORDER.map((status) => [status, 0]));
      const saleCounts = Object.fromEntries(SALE_STATUS_ORDER.map((status) => [status, 0]));

      for (const row of rows) {
        inventoryCounts[row.status] = (inventoryCounts[row.status] || 0) + 1;
        saleCounts[row.saleStatus] = (saleCounts[row.saleStatus] || 0) + 1;
      }

      els.inventoryStatusList.innerHTML = renderStatusCountChips(STATUS_ORDER, inventoryCounts, STATUS_META);
      els.saleStatusList.innerHTML = renderStatusCountChips(SALE_STATUS_ORDER, saleCounts, SALE_STATUS_META);
    }

    function renderStatusCountChips(order, counts, metaMap) {
      return order.map((status) => {
        const meta = metaMap[status] || { label: status, color: "#52605b" };
        const label = meta.label || status;
        return `
          <span class="status-count-chip">
            <span class="dot" style="background:${meta.color}"></span>
            ${escapeHtml(label)} <strong>${formatNumber(counts[status] || 0)}</strong>
          </span>
        `;
      }).join("");
    }

    function renderPriorityList() {
      const allPriorities = state.filteredRows
        .filter((row) => row.alert)
        .sort((a, b) => {
          const rankA = a.alert.includes("urgente") ? 0 : a.alert.includes("pronto") ? 1 : 2;
          const rankB = b.alert.includes("urgente") ? 0 : b.alert.includes("pronto") ? 1 : 2;
          if (rankA !== rankB) return rankA - rankB;
          return compareRows(a, b);
        });
      const priorities = state.showAllPriority ? allPriorities : allPriorities.slice(0, 3);

      els.priorityTotal.textContent = formatNumber(allPriorities.length);

      if (!allPriorities.length) {
        els.priorityList.innerHTML = `<p class="empty">Sin alertas para estos filtros</p>`;
        els.priorityMoreBtn.classList.add("hidden");
        return;
      }

      els.priorityList.innerHTML = priorities.map((row) => `
        <div class="priority-item">
          <div>
            <div class="priority-title">${escapeHtml(row.product || row.sku || "Producto sin nombre")}</div>
            <div class="priority-meta">${escapeHtml(row.storeName)} · ${formatDate(row.date)} · ${escapeHtml(row.sku || "sin SKU")}</div>
          </div>
          <span class="badge ${statusClass(row.status)}">${escapeHtml(row.alert)}</span>
        </div>
      `).join("");

      if (allPriorities.length > 3) {
        const hiddenCount = allPriorities.length - 3;
        els.priorityMoreBtn.classList.remove("hidden");
        els.priorityMoreBtn.textContent = state.showAllPriority ? "Ver menos" : `Ver ${formatNumber(hiddenCount)} mas`;
        els.priorityMoreBtn.setAttribute("aria-expanded", state.showAllPriority ? "true" : "false");
      } else {
        els.priorityMoreBtn.classList.add("hidden");
        els.priorityMoreBtn.setAttribute("aria-expanded", "false");
      }
    }

    function renderTable() {
      const rows = state.filteredRows;
      renderSortIndicators();
      if (!rows.length) {
        els.body.innerHTML = `<tr><td colspan="13" class="empty">Sin datos para estos filtros</td></tr>`;
        return;
      }

      const html = [];
      for (const row of rows) {
        const key = productKey(row);
        const history = getHistoryRows(row);
        const expanded = state.expandedProductKeys.has(key);
        html.push(renderSnapshotRow(row, { key, historyCount: history.length, expanded }));
        if (expanded) {
          html.push(...history.map((historyRow) => renderSnapshotRow(historyRow, { isHistory: true })));
        }
      }

      els.body.innerHTML = html.join("");
      bindHistoryToggles();
    }

    function renderSnapshotRow(row, options = {}) {
      const meta = STATUS_META[row.status] || STATUS_META["Sin ventas"];
      const saleMeta = SALE_STATUS_META[row.saleStatus] || SALE_STATUS_META["SIN VENTAS"];
      const isHistory = Boolean(options.isHistory);
      return `
        <tr class="${isHistory ? "history-row" : ""}">
          <td data-label="Historial">${isHistory ? '<span class="history-marker">Hist.</span>' : renderHistoryToggle(options.key, options.historyCount, options.expanded)}</td>
          <td data-label="Fecha">${formatDate(row.date)}</td>
          <td data-label="Tienda">${escapeHtml(row.storeName)}</td>
          <td data-label="Imagen">${renderImageCell(row)}</td>
          <td data-label="Producto" class="product-cell">${escapeHtml(row.product || "Sin nombre")}</td>
          <td data-label="SKU" class="sku">${escapeHtml(row.sku || "sin SKU")}</td>
          <td data-label="Stock" class="number">${formatNumber(row.stock)}</td>
          <td data-label="Ventas 7d" class="number">${formatNumber(row.sold7)}</td>
          <td data-label="Prom/dia" class="number">${formatDecimal(row.dailyAvg)}</td>
          <td data-label="Dias Stock" class="number">${formatDays(row.days)}</td>
          <td data-label="Estado inventario"><span class="badge ${meta.className}"><span class="dot" style="background:${meta.color}"></span>${escapeHtml(meta.label)}</span></td>
          <td data-label="Estado venta"><span class="badge ${saleMeta.className}"><span class="dot" style="background:${saleMeta.color}"></span>${escapeHtml(row.saleStatus || "SIN VENTAS")}</span></td>
          <td data-label="Alerta" class="${row.alert ? "alert-text" : ""}">${escapeHtml(row.alert || "")}</td>
        </tr>
      `;
    }

    function renderHistoryToggle(key, historyCount, expanded) {
      const disabled = historyCount ? "" : "disabled";
      const label = historyCount
        ? `${expanded ? "Ocultar" : "Ver"} historial (${historyCount})`
        : "Sin historial";
      return `
        <button type="button" class="history-toggle" data-history-key="${escapeHtml(key || "")}" ${disabled} aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">
          ${expanded ? "-" : "+"}
        </button>
      `;
    }

    function bindHistoryToggles() {
      els.body.querySelectorAll("[data-history-key]").forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.historyKey;
          if (state.expandedProductKeys.has(key)) state.expandedProductKeys.delete(key);
          else state.expandedProductKeys.add(key);
          renderTable();
        });
      });
    }

    function getHistoryRows(row) {
      const key = productKey(row);
      return state.historyRows
        .filter((historyRow) => productKey(historyRow) === key && historyRow.date < row.date)
        .sort(compareHistoryRows);
    }

    function renderImageCell(row) {
      if (!row.imageUrl) {
        return `<span class="image-placeholder" aria-label="Sin imagen">--</span>`;
      }
      return `<img class="product-thumb" src="${escapeHtml(row.imageUrl)}" alt="${escapeHtml(row.product || "Producto")}" loading="lazy">`;
    }

    function renderSortIndicators() {
      document.querySelectorAll("[data-sort-key]").forEach((button) => {
        const indicator = button.querySelector(".sort-indicator");
        const isActive = button.dataset.sortKey === state.sort.key;
        button.setAttribute("aria-sort", isActive ? (state.sort.direction === "asc" ? "ascending" : "descending") : "none");
        indicator.textContent = isActive ? (state.sort.direction === "asc" ? "↑" : "↓") : "";
      });
    }

    function setSort(key) {
      if (state.sort.key === key) {
        state.sort.direction = state.sort.direction === "asc" ? "desc" : "asc";
      } else {
        state.sort = { key, direction: getDefaultSortDirection(key) };
      }
      applyFilters();
    }

    function getDefaultSortDirection(key) {
      if (key === "date" || key === "stock" || key === "sold7" || key === "dailyAvg") return "desc";
      return "asc";
    }

    function resetFilters() {
      [
        els.searchInput,
        els.storeFilter,
        els.dateFilter,
        els.statusFilter,
        els.saleStatusFilter,
        els.alertFilter,
        els.stockMin,
        els.stockMax,
        els.soldMin,
        els.soldMax,
        els.avgMin,
        els.avgMax,
        els.daysMin,
        els.daysMax,
      ].forEach((control) => {
        control.value = "";
      });
      els.stockMin.value = DEFAULT_STOCK_MIN;
      state.expandedProductKeys.clear();
      state.showAllPriority = false;
      applyFilters();
    }

    function exportExcel() {
      if (!state.filteredRows.length) return;
      if (!window.XLSX) {
        alert("No se pudo cargar el exportador de Excel. Recarga la pagina e intenta de nuevo.");
        return;
      }

      const rows = state.filteredRows.map((row) => ({
        "Fecha": formatDate(row.date),
        "Tienda": row.storeName,
        "Imagen": row.imageUrl,
        "Producto": row.product,
        "SKU": row.sku,
        "Stock": row.stock,
        "Ventas 7d": row.sold7,
        "Prom/dia": row.dailyAvg,
        "Dias Stock": row.days === null ? "" : row.days,
        "Estado de Inventario": row.status,
        "Estado de Venta": row.saleStatus,
        "Alerta": row.alert,
      }));
      const worksheet = XLSX.utils.json_to_sheet(rows);
      worksheet["!cols"] = [
        { wch: 12 },
        { wch: 20 },
        { wch: 42 },
        { wch: 48 },
        { wch: 18 },
        { wch: 10 },
        { wch: 10 },
        { wch: 10 },
        { wch: 10 },
        { wch: 22 },
        { wch: 18 },
        { wch: 24 },
      ];
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Snapshots");

      const date = state.filteredRows[0]?.date || new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `dias_stock_dashboard_${date}.xlsx`);
    }

    function statusClass(status) {
      return (STATUS_META[status] || STATUS_META["Sin ventas"]).className;
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("es-PE", { maximumFractionDigits: 0 }).format(Number(value || 0));
    }

    function formatDecimal(value) {
      return new Intl.NumberFormat("es-PE", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(Number(value || 0));
    }

    function formatDays(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "-";
      return formatDecimal(value);
    }

    function formatDate(value) {
      if (!value) return "-";
      const [year, month, day] = value.split("-").map(Number);
      if (!year || !month || !day) return value;
      return new Date(year, month - 1, day).toLocaleDateString("es-PE", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    els.configToggle.addEventListener("click", () => {
      if (els.configPanel.classList.contains("hidden")) openConfig();
      else closeConfig();
    });

    els.clearConfigBtn.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      state.rows = [];
      state.filteredRows = [];
      state.historyRows = [];
      state.expandedProductKeys.clear();
      state.showAllPriority = false;
      openConfig("Credenciales locales borradas.");
      render();
      buildFilters();
      els.lastUpdated.textContent = "Sin datos cargados";
    });

    els.configForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const config = {
        url: els.supabaseUrl.value.trim(),
        anon: els.supabaseAnon.value.trim(),
      };
      const problem = getConfigProblem(config);
      if (problem) {
        els.configError.textContent = problem;
        return;
      }
      saveConfig(config.url, config.anon);
      refreshData();
    });

    els.refreshBtn.addEventListener("click", refreshData);
    els.exportExcelBtn.addEventListener("click", exportExcel);
    els.tableExportBtn.addEventListener("click", exportExcel);
    els.resetFiltersBtn.addEventListener("click", resetFilters);
    els.priorityMoreBtn.addEventListener("click", () => {
      state.showAllPriority = !state.showAllPriority;
      renderPriorityList();
    });
    els.loginForm.addEventListener("submit", handleLogin);
    els.searchInput.addEventListener("input", applyFilters);
    els.storeFilter.addEventListener("change", applyFilters);
    els.dateFilter.addEventListener("change", applyFilters);
    els.statusFilter.addEventListener("change", applyFilters);
    els.saleStatusFilter.addEventListener("change", applyFilters);
    els.alertFilter.addEventListener("change", applyFilters);
    [
      els.stockMin,
      els.stockMax,
      els.soldMin,
      els.soldMax,
      els.avgMin,
      els.avgMax,
      els.daysMin,
      els.daysMax,
    ].forEach((input) => input.addEventListener("input", applyFilters));
    document.querySelectorAll("[data-sort-key]").forEach((button) => {
      button.addEventListener("click", () => setSort(button.dataset.sortKey));
    });

    buildFilters();
    render();
    if (isLoggedIn()) {
      showApp();
      refreshData();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
